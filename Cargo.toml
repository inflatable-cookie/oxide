[package]
name = "oxide-storage"
version = "0.1.0"
edition = "2021"
rust-version = "1.97.1"
publish = false

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
hmac = { version = "=0.12.1", optional = true }
libc = { version = "=0.2.190", optional = true }

[features]
private-qualification = ["dep:hmac", "dep:libc"]
# Unpublished test-only blocking points. Off by default; never selected by bootstrap, env or argv.
private-qualification-fixture = ["private-qualification"]

[[bin]]
name = "oxide-qualified-runner"
path = "src/bin/qualified_runner.rs"
required-features = ["private-qualification"]

[[bin]]
name = "oxide-storage-runtime"
path = "src/bin/storage_runtime.rs"
required-features = ["private-qualification"]

[lib]
path = "src/lib.rs"
