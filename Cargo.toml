[package]
name = "oxide-storage"
version = "0.1.0"
edition = "2021"
rust-version = "1.97.1"
publish = false

[dependencies]
# Barge's storage library at the reviewed, merged revision. Pinned by full
# 40-hex rev, never a branch or tag. An
# existing Oxide root is adopted through Area::adopt_root with its own folder
# recorded, so its path, bytes and output links are preserved. Barge owns the
# volumes, declared areas, marked roots, cooperative holds, durable pins,
# byte-pressure pruning, idle LRU eviction, marker-checked trash and scratch;
# Oxide keeps its Cargo front door, slots, leases, recipes, output member links
# and seeding. Its own dependencies (serde, serde_json, libc) are already pinned
# here. Offline builds seed this locked Git source through
# scripts/offline_seed.py.
barge = { git = "https://github.com/inflatable-cookie/barge", rev = "3aacee23f5b8f9788525b41511cc2345a2066375" }
basic-toml = "=0.1.10"
# Cold-slot seeding source verification (oxide#166): a pinned archive reader
# for registry `.crate` files. `flate2` uses its pure-Rust backend and `tar` is
# used only for decompression and entry iteration; neither is fetched, run as
# a process, or configured at runtime. The lock adds exactly these registry
# packages, which the shared bounded offline seeder derives from `Cargo.lock`
# in the one supported crates.io sparse namespace: flate2, miniz_oxide,
# adler2, simd-adler32, crc32fast, tar and filetime (cfg-if and libc already).
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }
libc = "=0.2.190"
longhorn-storage-layout = { git = "https://github.com/inflatable-cookie/longhorn.git", tag = "v0.4.1" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"
tar = { version = "=0.4.46", default-features = false }

[dev-dependencies]
barge = { git = "https://github.com/inflatable-cookie/barge", rev = "3aacee23f5b8f9788525b41511cc2345a2066375", features = ["testing"] }

[[bin]]
name = "oxide-storage-inventory"
path = "src/bin/storage_inventory.rs"

[[bin]]
name = "oxide"
path = "src/bin/oxide/main.rs"


[lib]
path = "src/lib.rs"

# Opt-in development profiles (oxide#068). These are explicit recipes for the
# frozen stable Cargo 1.97.1 toolchain; they do not change the default
# dev/test/release profiles or any consumer. `oxide-light` keeps line tables
# for workspace units only; `oxide-full-debug` is the explicit control that
# restores full debug information for workspace, dependency and build-time
# units. See docs/knowledge/contracts/stable-cargo-profiles.md.
[profile.oxide-light]
inherits = "dev"
debug = "line-tables-only"
incremental = true
opt-level = 0
panic = "unwind"
debug-assertions = true
overflow-checks = true

[profile.oxide-light.package."*"]
debug = false

[profile.oxide-light.build-override]
debug = false

[profile.oxide-full-debug]
inherits = "dev"
debug = "full"
incremental = true
opt-level = 0
panic = "unwind"
debug-assertions = true
overflow-checks = true

[profile.oxide-full-debug.package."*"]
debug = "full"

[profile.oxide-full-debug.build-override]
debug = "full"
