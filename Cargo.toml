[package]
name = "oxide-storage"
version = "0.1.0"
edition = "2021"
rust-version = "1.97.1"
publish = false

[dependencies]
flate2 = "=1.1.10"
hmac = { version = "=0.12.1", optional = true }
libc = "=0.2.190"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
tar = "=0.4.46"

[features]
private-qualification = ["dep:hmac"]
# Unpublished test-only blocking points. Off by default; never selected by bootstrap, env or argv.
private-qualification-fixture = ["private-qualification"]

[[bin]]
name = "oxide-qualified-runner"
path = "src/bin/qualified_runner.rs"
required-features = ["private-qualification"]

[[bin]]
name = "oxide-storage-runtime"
path = "src/bin/storage_runtime.rs"
required-features = ["private-qualification"]

[[bin]]
name = "oxide-ordinary-cargo-attempt"
path = "src/bin/ordinary_cargo_attempt.rs"
required-features = ["private-qualification"]

[[bin]]
name = "oxide-declared-workflow"
path = "src/bin/declared_workflow.rs"
required-features = ["private-qualification"]

[[bin]]
name = "oxide-registry-acquisition"
path = "src/bin/registry_acquisition.rs"
required-features = ["private-qualification"]

[[bin]]
name = "oxide-storage-inventory"
path = "src/bin/storage_inventory.rs"

[lib]
path = "src/lib.rs"
