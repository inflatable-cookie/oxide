name: Release Binaries

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing annotated semver tag to release (vX.Y.Z)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  gates:
    name: Release gates
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.verify.outputs.tag }}
      version: ${{ steps.verify.outputs.version }}
    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}

      - name: Verify annotated tag, Cargo.toml version, and release state
        id: verify
        env:
          TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "error: tag '$TAG' must match semver format vX.Y.Z" >&2
            exit 1
          fi

          git fetch --force origin "refs/tags/${TAG}:refs/tags/${TAG}"
          tag_type=$(git cat-file -t "refs/tags/${TAG}")
          if [[ "$tag_type" != "tag" ]]; then
            echo "error: refs/tags/${TAG} has object type '${tag_type}'; an annotated tag is required" >&2
            exit 1
          fi

          tag_commit=$(git rev-parse "refs/tags/${TAG}^{commit}")
          head_commit=$(git rev-parse HEAD)
          if [[ "$tag_commit" != "$head_commit" ]]; then
            echo "error: tag ${TAG} resolves to ${tag_commit}, which does not match HEAD ${head_commit}" >&2
            exit 1
          fi

          cargo_version=$(python3 - <<'PY'
          import pathlib, re

          text = pathlib.Path("Cargo.toml").read_text(encoding="utf-8")
          pkg = re.search(r"^\[package\]\s*(.*?)(?=^\[|\Z)", text, re.M | re.S)
          assert pkg, "[package] section missing in Cargo.toml"
          ver = re.search(r"^version\s*=\s*\"([^\"]+)\"", pkg.group(1), re.M)
          assert ver, "version missing in [package]"
          print(ver.group(1))
          PY
          )
          expected_tag="v${cargo_version}"
          if [[ "$TAG" != "$expected_tag" ]]; then
            echo "error: tag '${TAG}' does not match Cargo.toml oxide-storage version '${cargo_version}' (expected '${expected_tag}')" >&2
            exit 1
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "error: GitHub Release '${TAG}' already exists; refusing to overwrite" >&2
            exit 1
          fi

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${cargo_version}" >> "$GITHUB_OUTPUT"

      - name: Read pinned Rust toolchain
        id: toolchain
        shell: bash
        run: |
          set -euo pipefail
          channel=$(python3 -c 'import pathlib, re; text = pathlib.Path("rust-toolchain.toml").read_text(encoding="utf-8"); m = re.search(r"^channel\s*=\s*\"([^\"]+)\"", text, re.M); assert m, "channel missing in rust-toolchain.toml"; print(m.group(1))')
          echo "channel=${channel}" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: rustfmt

      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check changelog fragments
        run: python3 scripts/changelog.py check

      - name: Build release binary
        env:
          RUSTFLAGS: "-D warnings"
        run: cargo build --release --locked --bin oxide

  build:
    name: Build (${{ matrix.target }})
    needs: gates
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-15
            native: true
            cross: false
          - target: x86_64-apple-darwin
            os: macos-15-intel
            native: true
            cross: false
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            native: true
            cross: false
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04
            native: false
            cross: true
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ needs.gates.outputs.tag }}

      - name: Read pinned Rust toolchain
        id: toolchain
        shell: bash
        run: |
          set -euo pipefail
          channel=$(python3 -c 'import pathlib, re; text = pathlib.Path("rust-toolchain.toml").read_text(encoding="utf-8"); m = re.search(r"^channel\s*=\s*\"([^\"]+)\"", text, re.M); assert m, "channel missing in rust-toolchain.toml"; print(m.group(1))')
          echo "channel=${channel}" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          targets: ${{ matrix.target }}

      - name: Set up cross-compilation toolchain
        if: matrix.cross
        uses: taiki-e/setup-cross-toolchain-action@v1
        with:
          target: ${{ matrix.target }}

      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Build release binary
        env:
          RUSTFLAGS: "-D warnings"
          TARGET: ${{ matrix.target }}
        shell: bash
        run: cargo build --release --locked --bin oxide --target "$TARGET"

      - name: Smoke-test native binary
        if: matrix.native
        env:
          TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          set -euo pipefail
          bin="target/${TARGET}/release/oxide"
          "$bin" --version
          "$bin" --help >/dev/null

      - name: Package release tarball
        env:
          TAG: ${{ needs.gates.outputs.tag }}
          TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          set -euo pipefail
          stage="${RUNNER_TEMP}/package-${TARGET}"
          rm -rf -- "$stage"
          mkdir -p "$stage"
          cp "target/${TARGET}/release/oxide" "${stage}/oxide"
          chmod 755 "${stage}/oxide"
          cp LICENSE "${stage}/LICENSE"
          cp README.md "${stage}/README.md"
          archive="${RUNNER_TEMP}/oxide-${TAG}-${TARGET}.tar.gz"
          tar -C "$stage" -czf "$archive" oxide LICENSE README.md
          tar -tzf "$archive"

      - name: Upload tarball artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: ${{ runner.temp }}/oxide-${{ needs.gates.outputs.tag }}-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [gates, build]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ needs.gates.outputs.tag }}

      - name: Download release tarballs
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist

      - name: Generate and verify SHA-256 checksums
        env:
          TAG: ${{ needs.gates.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          expected=(
            "oxide-${TAG}-aarch64-apple-darwin.tar.gz"
            "oxide-${TAG}-x86_64-apple-darwin.tar.gz"
            "oxide-${TAG}-x86_64-unknown-linux-gnu.tar.gz"
            "oxide-${TAG}-aarch64-unknown-linux-gnu.tar.gz"
          )
          for f in "${expected[@]}"; do
            if [[ ! -f "dist/${f}" ]]; then
              echo "error: missing expected tarball dist/${f}" >&2
              exit 1
            fi
          done
          (
            cd dist
            sha256sum "${expected[@]}" > SHA256SUMS.txt
            sha256sum -c SHA256SUMS.txt
            cat SHA256SUMS.txt
          )

      - name: Extract release notes from CHANGELOG.md
        id: notes
        env:
          VERSION: ${{ needs.gates.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          notes_file="${RUNNER_TEMP}/release-notes.md"
          python3 - "$VERSION" "$notes_file" <<'PY'
          import pathlib, re, sys

          version, out_path = sys.argv[1], sys.argv[2]
          lines = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8").splitlines()
          header_re = re.compile(rf"^##\s+\[{re.escape(version)}\](?:\s|$)")
          next_re = re.compile(r"^##\s+\[")

          start = None
          for i, line in enumerate(lines):
              if header_re.match(line):
                  start = i + 1
                  break

          body = []
          if start is not None:
              for line in lines[start:]:
                  if next_re.match(line):
                      break
                  body.append(line)

          text = "\n".join(body).strip()
          pathlib.Path(out_path).write_text((text + "\n") if text else "", encoding="utf-8")
          PY
          if [[ -s "$notes_file" ]]; then
            echo "has_notes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_notes=false" >> "$GITHUB_OUTPUT"
          fi
          echo "notes_file=${notes_file}" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.gates.outputs.tag }}
          HAS_NOTES: ${{ steps.notes.outputs.has_notes }}
          NOTES_FILE: ${{ steps.notes.outputs.notes_file }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "error: GitHub Release '${TAG}' already exists; refusing to overwrite" >&2
            exit 1
          fi
          args=(
            "$TAG"
            --verify-tag
            --title "$TAG"
          )
          if [[ "$HAS_NOTES" == "true" ]]; then
            args+=(--notes-file "$NOTES_FILE")
          else
            args+=(--generate-notes)
          fi
          gh release create "${args[@]}" \
            "dist/oxide-${TAG}-aarch64-apple-darwin.tar.gz" \
            "dist/oxide-${TAG}-x86_64-apple-darwin.tar.gz" \
            "dist/oxide-${TAG}-x86_64-unknown-linux-gnu.tar.gz" \
            "dist/oxide-${TAG}-aarch64-unknown-linux-gnu.tar.gz" \
            "dist/SHA256SUMS.txt"
