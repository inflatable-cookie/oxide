# Relax focused compatibility recheck (oxide#308), float-formatting probe.
#
# Exactly the two pinned identities the prior trial's snapshot lock resolves:
# serde_json 1.0.151, whose float formatting goes through zmij 1.0.23 on
# aarch64. zmij 1.0.23 imports 43 `core::arch::aarch64` names and the old Relax
# pin's bundled core lacked 20 of them, so this package is the smallest honest
# exercise of the observed blocker: if the pinned engine cannot compile zmij,
# this probe fails at the same place the snapshot workload failed, and if it
# compiles, the serialized digits and the decoded bits are compared against the
# plain-Cargo baseline.
#
# `=1.0.151` is the exact pin. The lock the guarded occurrence establishes
# offline must resolve serde_json 1.0.151 and zmij 1.0.23 with the workload
# lock's own checksums; the apparatus verifies those identities before any
# child runs instead of adding an unused direct zmij dependency that would
# change feature unification.
[workspace]

[package]
name = "compat-fmt"
version = "0.1.0"
edition = "2021"
rust-version = "1.97.1"
publish = false

[dependencies]
serde_json = "=1.0.151"
