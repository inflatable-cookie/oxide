# confirm Cargo group / stays held, and a later oxide command recovers it / is
# retired and stays held / quarantined: lost with the removable volume) aborts
# and leaves the rest unexecuted, because the group's custody is unknown. An
# abort retains an uncertain resource: the owned image is re-attached only after
# a case COMPLETED (case 24 has no finally), the ordinary detach needs a clean
# collection with no unclosed child, and the failure-cleanup path applies the same
# gate (it records the retention instead of detaching), so none of them touches
# custody while it is unconfirmed. The COUNTED run's tail goes through the same
# latching wrapper, so ANY unsuccessful ordinary detach (a nonzero hdiutil, a
# signal, a timeout) or a custody fault escaping its collector latches unknown
# custody before any outer cleanup: the counted failure cleanup never detaches
# twice, the original fault is preserved, and the recorded disposition names the
# retention the cleanup made. A detach that RETURNS while the image is still
# mounted is the same unknown device outcome: the counted tail aborts (never a
# pass) and the image is retained. Its bounded
# `qualified: false` receipt is written in every
# outcome, and a skipped or unexecuted case is never a pass. Each run needs its
# own owner activation, and only a counted run at the exact merge head can
# pass. Not a benchmark, real-drive qualification or an alias for full QA.
#
# `proof:exec-inference:test` is the pure apparatus check of that collection:
# the real case table, collector and receipt builder with fake bodies and seams,
# including the runtime binding of every case body (a case calling a helper that
# does not exist fails here) and the failure-cleanup retention gate in both modes,
# with a counted signalled-detach counterfactual (no second detach).
# It stages nothing, starts no child and touches no scratch, image, pool or
# supervisor, so a dispatch, dependency-skip, keep-going, abort-latch or receipt
# regression costs no native activation.
