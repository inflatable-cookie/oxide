[manifest]
minimum_effigy_version = "0.14.0"

[tasks]
# Ordinary Rust selectors run through the installed `oxide`. When `oxide` itself
# is broken, use Effigy's machine-wide per-program fallback or cargo by hand.
"rust:compile" = "oxide check --workspace --all-targets --locked"
"rust:format" = "oxide fmt --all -- --check"
# Release-profile compile of the binaries with warnings fatal.
"rust:compile-release" = "RUSTFLAGS='-D warnings' oxide check --release --workspace --bins --locked"
# Duplicate packages in the normal dependency closure for every target. Reads the
# lock; builds nothing.
"rust:tree-duplicates" = "oxide tree --locked --offline -e normal -d --target all"
# Install lifecycle, planner-only after a reviewed merge. `oxide:install` refuses
# an existing `oxide`; `oxide:reinstall` replaces only the binary matching the
# newest receipt; `oxide:canary` runs the staged live-pool check.
"oxide:canary" = "python3 scripts/oxide-install.py --canary {args}"
"oxide:install" = "python3 scripts/oxide-install.py {args}"
"oxide:reinstall" = "python3 scripts/oxide-install.py --replace {args}"
"oxide:rollback" = "python3 scripts/oxide-install.py --rollback"
# Synthetic fixtures for the installer's link, clobber and identity refusals and
# the staged canary. Never builds or installs.
"dogfood:scripts:test" = "python3 -B scripts/test_dogfood_scripts.py"
"changelog:check" = "python3 scripts/changelog.py check"
"changelog:fold" = "python3 scripts/changelog.py fold {args}"
"changelog:test" = "bash scripts/changelog.test.sh"
"docs:check" = [
  "effigy skill run northstar-docs/check-links -- --frozen '^docs/knowledge/architecture[.]md$' --frozen '^docs/knowledge/evidence/'",
  "effigy changelog:check",
  "git diff --check HEAD",
]
"rust:format-write" = "oxide fmt --all"

# Covering ordinary suite: the full workspace unit and integration tests, serial,
# with every fixture below the caller's task TMPDIR. Effigy owns heavy admission
# and the run deadline. A failing or interrupted run keeps its fixture root and
# names it, including when a signal ends the suite.
[tasks."rust:barge-adoption"]
admission = "heavy"
run = '''adoption_root=$(mktemp -d "${TMPDIR:?}/qa.XXXXXX") || exit 2
retain_fixtures() {
  echo "oxide adoption fixtures retained after $1: $adoption_root" >&2
}
trap 'retain_fixtures "interrupt"; exit 130' INT TERM
echo "oxide adoption fixtures: $adoption_root"
TMPDIR="$adoption_root" TMP="$adoption_root" TEMP="$adoption_root" OXIDE_TASK_SCRATCH_ROOT="$adoption_root" OXIDE_TEST_INTERNAL_ROOT="$adoption_root" oxide test --workspace --all-targets --locked -- --test-threads=1
adoption_exit=$?
if [ "$adoption_exit" -eq 0 ]; then
  trap - INT TERM
  rm -rf -- "$adoption_root"
else
  retain_fixtures "exit $adoption_exit"
fi
exit "$adoption_exit"'''

# Compile all targets, including the Linux pool regression, for the installed
# target. No linking or runtime claim.
[tasks."rust:barge-adoption-linux"]
admission = "heavy"
run = "oxide check --workspace --all-targets --locked --offline --target x86_64-unknown-linux-gnu"
