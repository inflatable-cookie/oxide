# first conversion (S4b): the focused `exec-inference` mode of the #117/#121
# fixture, under the same qualified shared proof supervisor (300 s, 512 MiB
# monitored scratch, ordinary detach) and one owned 128 MiB scratch image
# attached with `hdiutil -owners on` on every attach. A fresh eligible
# checkout's first leased build creates a real `target` holding owned
# `debug`/`release` member links into one root, an `exec` with no `--output`
# derives its member set from that committed receipt and places its tool's
# build in the root, a repeat reuses the warm slot, the declared `--output`
# override reaches the same key, an unrecorded member stays real and local, a
# detached and an unconverted checkout run locally, a spaced checkout path
# works end to end, an existing whole-target fixture (case 09) stays
# whole-target through a build and an exec, and a foreign member link, root
# drift, a receipt changed while the command waits and an interrupted tool
# whose surviving group member holds the lease (case 15) all behave as
# recorded with the links, receipt and roots unchanged where they must be.
