[manifest]
minimum_effigy_version = "0.14.0"

[tasks]
# Ordinary Rust selectors run through the installed `oxide` (dogfooding,
# oxide#087). Each `:cargo` twin keeps the plain-Cargo command: use it when
# `oxide` itself is broken. `fmt` is a Cargo passthrough with no lease.
"rust:compile" = "oxide check --workspace --all-targets --locked"
"rust:compile:cargo" = "cargo check --workspace --all-targets --locked"
"rust:format" = "oxide fmt --all -- --check"
"rust:format:cargo" = "cargo fmt --all -- --check"
# Compile-only check of the crate for the already-installed Linux target
# (oxide#077). It never installs a target, links or runs anything, so it is
# not Linux runtime validation.
"rust:compile-linux" = "oxide check --locked --offline --target x86_64-unknown-linux-gnu"
"rust:compile-linux:cargo" = "cargo check --locked --offline --target x86_64-unknown-linux-gnu"
# Duplicate packages in the normal dependency closure for every target
# (oxide#103: exactly one sha2). Reads the lock; builds nothing.
"rust:tree-duplicates" = "oxide tree --locked --offline -e normal -d --target all"
# Build `oxide` with plain Cargo from origin main's tip (or
# OXIDE_INSTALL_PIN, a commit on it) and install it at ~/.local/bin/oxide
# with a hash receipt under ~/.local/state/oxide/install. `oxide:install`
# refuses any existing `oxide`; `oxide:reinstall` replaces only the binary
# matching the newest receipt.
"oxide:install" = "python3 scripts/oxide-install.py"
"oxide:reinstall" = "python3 scripts/oxide-install.py --replace"
# Synthetic fixtures for the installer's link, clobber and identity
# refusals. Never builds or installs.
"dogfood:scripts:test" = "python3 scripts/test_dogfood_scripts.py"
# The shared session supervisor's pure cases (oxide#109): fake clock, process
# table, signals and readings; spawns nothing. Not the qualification.
"proof:supervisor:test" = "python3 scripts/test_supervisor.py --pure"
# Builds the unpublished oxide-storage-inventory binary and proves the
# rendered output-byte ceiling on tiny synthetic fixtures. Not a QA alias
# and not a real project-target scan.
"rust:storage-inventory-cli" = "python3 scripts/test-storage-inventory-cli.py"
"build-context:comparison:test" = "python3 scripts/test_build_context_comparison.py"
"docs:check" = [
  "effigy skill run northstar/check-links -- --frozen '^docs/knowledge/architecture[.]md$'",
  "effigy skill run northstar/retired-concepts",
  "git diff --check HEAD",
]

[test.suites.rust]
run = "python3 scripts/bounded-test.py oxide test --workspace --all-targets --locked"
default = false

# Plain-Cargo escape for `test rust`.
[test.suites.rust-cargo]
run = "python3 scripts/bounded-test.py cargo test --workspace --all-targets --locked"
default = false

# Installed-binary hand-off (oxide#122): one author proof, one fixed script
# and the whole command under the qualified shared supervisor, within the
# approved 120 s / 64 MiB bounds. Inside that scratch it stages this HEAD's
# debug `oxide` with plain Cargo offline and 1.97.1 (-j1, one codegen unit,
# debug-free, symbol-stripped, size-optimised), deletes the staged target,
# then runs private HOME, receipt and directory-pool fixtures. It creates no
# Oxide pool and touches no live pool, ~/.local/bin/oxide, install receipt or
# host state. Measured peak: 58.3 MiB of the 64 MiB gate, staging ~37 s. Not
# a benchmark, a real-install qualification or an alias for full QA.
[tasks."rust:installed-handoff"]
admission = "heavy"
run = "python3 scripts/bounded-test.py --limit 120 --scratch-budget-mib 64 -- python3 scripts/test-installed-handoff.py"

# Enumerated paths that disappear during accounting (oxide#113): the
# qualified session supervisor bounds one fixed native proof covering the
# debug-only walk hook, status/refusal diagnostics, whole-slot eviction and
# conservative refusal for a real accounting gap. No live pool or cache.
[tasks."rust:accounting-vanished"]
admission = "heavy"
run = "python3 scripts/bounded-test.py --limit 300 --scratch-budget-mib 512 -- python3 scripts/test-accounting-vanished.py"

# Fast, read-only default `oxide status` (oxide#128): one fixed proof under the
# qualified shared supervisor (oxide#109; 300 s absolute, 512 MiB monitored
# scratch including staging, fixture creation and cleanup). Stages this HEAD's
# debug `oxide` offline with 1.97.1 and builds private hand-made directory
# pools: small private ledger/pool fixtures (one recorded slot, a held
# command, waiting ticket, clean mark, flush and a recorded Evicting slot. It
# proves structurally, with the debug-only walk log, that default status runs
# no payload/checkout/Cargo-home walk and reconciles nothing, and that
# --measure logs exactly the payload and per-slot walks; the shared measure
# deadline is the library test added at 9269; a debug-only scoped 61 s delay at
# the payload root drives the real 60 s budget to a partial elapsed-deadline
# result and a scoped denial proves default never reaches the hook. A small
# default-status timing is
# a sanity observation only, never a large-pool or universal latency claim; proves zero
# mutation with a bounded before/after
# metadata digest and exact control bytes, covers held/waits/clean/flush and
# nested-directory rendering, valid/stale/future/mismatched/missing/corrupt
# observation facts, no lock creation, a recorded removable pool with an
# absent volume (no diskutil), and `--measure` on tiny pools for walked bytes,
# coverage and an untouched recorded deletion. No sparse image, mount, real
# pool, host install, config, mode or cleanup is involved. Not a benchmark,
# not a universal filesystem-latency guarantee and not an alias for full QA.
[tasks."rust:status-fast"]
admission = "heavy"
run = "python3 scripts/bounded-test.py --limit 300 --scratch-budget-mib 512 -- python3 scripts/test-status-fast.py"

# Final outputs on the permanent drive (oxide#117), under the qualified
# shared supervisor (oxide#109; 300 s absolute, 512 MiB monitored scratch,
# ordinary detach). Stages this HEAD's debug `oxide` offline with 1.97.1 and
# models the drive as one owned 128 MiB scratch APFS image at a unique
# /Volumes name: effect-free plan, refusals without mutation, explicit
# conversion to an owned link, builds/run/test/profiles through it, the
# checkout-local fallback and redock with both roots kept, the git-tracked
# refusal, a wrong volume UUID with no shadow write, an active writer
# blocking the swap, crash replay after prepared/sibling/renamed, clean
# preserving the link, marker and inactive roots, and detach. Not a
# benchmark, real-drive qualification or an alias for full QA.
[tasks."rust:permanent-outputs"]
admission = "heavy"
run = "python3 scripts/bounded-test.py --limit 300 --scratch-budget-mib 512 -- python3 scripts/test-permanent-outputs.py"

# Automatic first conversion (oxide#121): the focused `auto-adopt` mode of the
# #117 fixture, under the same qualified shared supervisor (300 s, 512 MiB
# monitored scratch, ordinary detach) and one owned 128 MiB scratch image.
# Eligible fresh adoption with warm reuse; every non-adoption control (real,
# empty, foreign, dangling and file targets, detached and corrupt receipts,
# ephemeral mode, absent drive, internal fallback); crash replay with a
# creator refused and an unpublished preparation rolled back; and a committed
# adoption that survives a failed build. Not a benchmark, real-drive
# qualification or an alias for full QA.
[tasks."rust:auto-adopt-outputs"]
admission = "heavy"
run = "python3 scripts/bounded-test.py --limit 300 --scratch-budget-mib 512 -- python3 scripts/test-permanent-outputs.py auto-adopt"

# Per-checkout detach under permanent mode (oxide#124): the focused
