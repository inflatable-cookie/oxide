[manifest]
minimum_effigy_version = "0.14.0"

[tasks]
# Ordinary Rust selectors run through the installed `oxide` (dogfooding,
# oxide#087). When `oxide` itself is broken, the outage escape is Effigy's
# machine-wide per-program fallback (oxide#153), or `cargo` by hand.
# `fmt` is a Cargo passthrough with no lease.
"rust:compile" = "oxide check --workspace --all-targets --locked"
"rust:format" = "oxide fmt --all -- --check"
# Compile-only check of the crate for the already-installed Linux target
# (oxide#077). It never installs a target, links or runs anything, so it is
# not Linux runtime validation.
"rust:compile-linux" = "oxide check --locked --offline --target x86_64-unknown-linux-gnu"
# Release-profile compile of the binaries (oxide#187). Debug-only proof items
# reached from unconditional code fail here, which the debug selectors miss.
# `-D warnings` makes the release profile's own diagnostics fatal (oxide#223),
# so the profile Oxide is installed from cannot accumulate actionable warnings;
# Cargo still caps dependency lints, so this covers the workspace package only.
"rust:compile-release" = "RUSTFLAGS='-D warnings' oxide check --release --workspace --bins --locked"
# Duplicate packages in the normal dependency closure for every target
# (oxide#103: exactly one sha2). Reads the lock; builds nothing.
"rust:tree-duplicates" = "oxide tree --locked --offline -e normal -d --target all"
# Build `oxide` with plain Cargo from origin main's tip (or
# OXIDE_INSTALL_PIN, a commit on it) and install it at ~/.local/bin/oxide
# with a hash receipt under ~/.local/state/oxide/install. `oxide:install`
# refuses any existing `oxide`; `oxide:reinstall` replaces only the binary
# matching the newest receipt.
"oxide:install" = "python3 scripts/oxide-install.py"
"oxide:reinstall" = "python3 scripts/oxide-install.py --replace"
# Synthetic fixtures for the installer's link, clobber and identity
# refusals. Never builds or installs.
"dogfood:scripts:test" = "python3 scripts/test_dogfood_scripts.py"
# The shared session supervisor's pure cases (oxide#109): fake clock, process
# table, signals and readings; spawns nothing. Not the qualification.
"proof:supervisor:test" = "python3 scripts/test_supervisor.py --pure"
# Effect-free readiness for the selected host (oxide#151): path, mode, owner and
# device metadata only. Creates nothing (an absent private leaf is reported as
# planned), never sweeps, marks, forks the deadline actor or launches the
# candidate. Point-in-time readiness, not a reservation, admission or
# qualification; the invoked proof re-checks everything in its own setup.
"proof:supervisor:preflight" = "python3 scripts/qualify-supervisor.py --preflight"
# Builds the unpublished oxide-storage-inventory binary and proves the
# rendered output-byte ceiling on tiny synthetic fixtures. Not a QA alias
# and not a real project-target scan.
"rust:storage-inventory-cli" = "python3 scripts/test-storage-inventory-cli.py"
"build-context:comparison:test" = "python3 scripts/test_build_context_comparison.py"
"changelog:check" = "python3 scripts/changelog.py check"
"changelog:fold" = "python3 scripts/changelog.py fold {args}"
"changelog:test" = "bash scripts/changelog.test.sh"
"docs:check" = [
  "effigy skill run northstar/check-links -- --frozen '^docs/knowledge/architecture[.]md$'",
  "effigy skill run northstar/retired-concepts",
  "effigy changelog:check",
  "git diff --check HEAD",
]

# Lean adoption uses the same sanctioned covering route, with no named skips.
[tasks."rust:barge-adoption"]
admission = "heavy"
run = "python3 scripts/rust-test-600.py"

# Apply formatting during source authoring; rust:format remains check-only.
[tasks."rust:format-write"]
run = "oxide fmt --all"

[test.suites.rust]
run = "python3 scripts/bounded-test.py oxide test --workspace --all-targets --locked"
default = false

# The covering Rust unit suite at 600 s with the AGENTS dual-root recipe
# (oxide#224). Same suite as `test rust`, under the same qualified shared
# supervisor, but with its fixed 600 s / 512 MiB bounds and the two roots that
# suite alone needs: a monitored internal root (`OXIDE_TASK_SCRATCH_ROOT` and
# `OXIDE_TEST_INTERNAL_ROOT` on the boot volume) and ordinary test temp on the
# selected volume (`TMPDIR`/`TMP`/`TEMP` under
# `<mount>/scratch/oxide-validation`). The wrapper creates exactly those two
# per-run roots, refuses inherited/shared/home/mount roots, and removes them
# only after a closed run; any other outcome keeps them and prints their paths.
# Not full QA. `proof:rust-test-600:test` runs only the wrapper's pure
# self-check (refusals, environment, command, cleanup) with no suite or scratch.
[tasks."rust:test-600"]
run = "python3 scripts/rust-test-600.py"

[tasks."proof:rust-test-600:test"]
run = "python3 scripts/rust-test-600.py --self-check"

[tasks."proof:rust-test-600:plan"]
run = "python3 scripts/rust-test-600.py --plan"

# Merge-base identity with explicit seeding opt-out (oxide#176). The two
# tests in tests/cold_seed_default_off.rs need a staged merge-base oxide, so
# they are #[ignore] in the unit suite. This selector reuses the #104 stage_at
# helper, exports OXIDE_SEED_BASELINE_BINARY, and runs that target with
# --ignored. Default baseline is git merge-base HEAD origin/main; override
# with OXIDE_SEED_BASELINE_COMMIT. 300 s / 512 MiB owned scratch. The
# fixture uses a scratch pool on the supervisor-selected volume. Baselines
# must contain scratch-pools S3 (79e55f4). A /private/tmp fallback exercises
# the inert internal path and is not scratch-pool coverage. Not full QA.
[tasks."rust:seed-default-off"]
admission = "heavy"
run = "python3 scripts/bounded-test.py --limit 300 --scratch-budget-mib 512 -- python3 scripts/test-seed-default-off.py"

[tasks."proof:seed-default-off:test"]
run = "python3 scripts/test-seed-default-off.py --self-check"

[tasks."proof:seed-default-off:plan"]
run = "python3 scripts/test-seed-default-off.py --plan"

[tasks."rust:seed-default-off:diagnostic"]
admission = "heavy"
run = "python3 scripts/bounded-test.py --limit 300 --scratch-budget-mib 512 -- python3 scripts/test-seed-default-off.py --diagnostic"

# Installed-binary hand-off (oxide#122): one author proof, one fixed script
# and the whole command under the qualified shared supervisor, within the
# approved 600 s / 128 MiB bounds (decisions 5bf3c438 and 49f52581). Inside that scratch it stages this HEAD's
# debug `oxide` with plain Cargo offline and 1.97.1 (-j1, one codegen unit,
# debug-free, symbol-stripped, size-optimised), deletes the staged target,
# then runs private HOME, receipt and scratch-pool fixtures on the selected
# volume. It touches no live pool, ~/.local/bin/oxide, install receipt or
# host state. Historical staging measured 58.3 MiB; the 64 MiB diagnostic
# faulted at 64.4 MiB and remains unqualified. Not
# a benchmark, a real-install qualification or an alias for full QA.
# The integration target imports the actual trace module under release cfg;
# the shared supervisor retains the unit suite's 300 s / 512 MiB bounds.
[tasks."proof:handoff-trace:release-test"]
run = "python3 scripts/bounded-test.py oxide test --release --locked --test handoff_trace_release handoff_trace::tests::release_trace_is_disabled_even_with_private_layout -- --exact"

[tasks."proof:installed-handoff:test"]
run = "python3 scripts/test-installed-handoff.py --self-check"

[tasks."rust:installed-handoff"]
admission = "heavy"
run = "python3 scripts/bounded-test.py --limit 600 --scratch-budget-mib 128 -- python3 scripts/test-installed-handoff.py"

[tasks."rust:installed-handoff:diagnostic"]
admission = "heavy"
run = "python3 scripts/bounded-test.py --limit 600 --scratch-budget-mib 128 -- python3 scripts/test-installed-handoff.py --diagnostic"

[tasks."proof:installed-handoff:plan"]
run = "python3 scripts/test-installed-handoff.py --plan"

# Owned output links at profile directories (oxide#133): a mode-split
# script and the whole command of the qualified shared supervisor. The brief's
# scoped amendment (root owner, 2026-10-23T16:10Z) makes this proof 600 s TOTAL
# instead of 420; the old 420 s publication at 030836f6 stays historical and
# unactivated. The helper work cutoff is about 565 s (30 s reserve plus a 5 s
# refusal margin), inside which cleanup and image detach must finish. The
# published estimate is UNMEASURED. CPU controls support a 6 CPU / 8 GiB
# planning request: Builds stages the candidate; base-compat stages the base
# and candidate sequentially, each bounded to 6 Cargo jobs. Fixture Cargo
# children are bounded to 2 jobs with at
# most two gated writers overlapping, so the proof peaks at 6 concurrent Cargo
# jobs; the shared staging helper takes that bound explicitly and keeps its
# default for other selectors. Its private 128 MiB image is attached with
# `hdiutil attach -owners on` on every attach and reattach, observed with a
# bounded read-only mount check and the product's own registration refusal for
# an ignore-ownership mount; no real drive or host setting changes. The 128 MiB
# image is registered at a 16 MiB reserve / 64 MiB cap, a positive control proves
# an external root is really selected before the external oracles, and a
# separate deliberate low-reserve control raises the recorded registration
# reserve to 200 MiB and restores its exact bytes to prove the honest local
# fallback; a `/target/` parent-ignore control proves a directory-only rule is
# refused for the legacy link but accepted for profile members, a benign
# ordinary target-root file on its own checkout keeps the top-level preservation
# control nonvacuous (a clean of that checkout must refuse it as foreign and
# succeed after removal), a real peer checkout receipt for the same root proves
# another reference keeps it, and Cargo's own metadata is asserted only when
# present.
# The selected-clean reserve stop uses a positively created directory-budget
# pool; the removable watchdog is removal-only and is not claimed as a reserve
# stop.
# Both modes use 512 MiB and ordinary detach. Builds stages only this HEAD's
# candidate (capability >= 4) and covers the member layout, binding, migration,
# clean and refusals. Base-compat stages base 4a70b83 and the
# candidate from authenticated pinned source, asserts distinct binaries and
# exact base capability 3, and covers base cases 10, 11 and 19 plus case 20
# root-group prune with its boot-Data checkout-absence premise.
# Each mode requires its own owner-activated diagnostic, counted author and
# independent reviewer native at the reviewed head.
# Builds fixtures use a private OXIDE_SCRATCH_ROOT under the selected runner root.
# The scoped base-compat selectors alone retain the internal root (bd357a4c).
[tasks."proof:profile-outputs:test"]
run = "python3 scripts/test-profile-outputs.py --self-check"

[tasks."proof:profile-outputs:base-compat:test"]
run = "python3 scripts/test-profile-outputs.py --base-compat --self-check"

[tasks."proof:profile-outputs:plan"]
run = "python3 scripts/test-profile-outputs.py --plan"

[tasks."proof:profile-outputs:base-compat:plan"]
run = "python3 scripts/test-profile-outputs.py --base-compat --plan"

[tasks."rust:profile-outputs"]
admission = "heavy"
run = "python3 scripts/bounded-test.py --limit 600 --scratch-budget-mib 512 -- python3 scripts/test-profile-outputs.py"

# The same selected mode in its own opt-in diagnostic collection mode
