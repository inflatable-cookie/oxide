# staging, the fixture pool, temp and the single owned 128 MiB image. Builds,
# tests and ordinary proofs keep the drive default. The acceptance covers this
# and similar internal-placement proofs only; execution still needs its own
# source confirmation and separate activation.
[tasks."rust:pool-temp-scratch"]
admission = "heavy"
run = "python3 scripts/bounded-test.py --root-parent /private/tmp --limit 300 --scratch-budget-mib 512 -- python3 scripts/test-pool-temp-scratch.py"

