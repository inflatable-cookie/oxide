# owned directory is accounted once while held and removed at release, that a
# live `run` program's lease fences it from a competing command until its group
# closes, that a crash with a surviving writer keeps it and the closed group is
# observed from outside before the next command reconciles or evicts the
# leftover, that a foreign entry, a link or an over-bound path refuses
# without spawning, and that one owned 128 MiB
# scratch APFS image puts the child's temporary files on the image with an
# internal fallback after an ordinary detach and no stale mount point. It
# reports the longest injected path in bytes and characters against the
# 91-byte socket bound. No live pool, registered drive, install or consumer is
# touched. Not a benchmark and not an alias for full QA.
# Owner-accepted single exception (decision bd357a4c, 2026-10-25: "Accept the
# internal-root exception for internal-placement proofs (#136 now, similar
# proofs later)"). The oxide#136 proof needs a genuine *internal* directory
