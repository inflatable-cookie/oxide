[manifest]
minimum_effigy_version = "0.14.0"

[tasks]
# Ordinary Rust selectors run through the installed `oxide` (dogfooding,
# oxide#087). When `oxide` itself is broken, the outage escape is Effigy's
# machine-wide per-program fallback (oxide#153), or `cargo` by hand.
# `fmt` is a Cargo passthrough with no lease.
"rust:compile" = "oxide check --workspace --all-targets --locked"
"rust:format" = "oxide fmt --all -- --check"
# Compile-only check of the crate for the already-installed Linux target
# (oxide#077). It never installs a target, links or runs anything, so it is
# not Linux runtime validation.
"rust:compile-linux" = "oxide check --locked --offline --target x86_64-unknown-linux-gnu"
# Duplicate packages in the normal dependency closure for every target
# (oxide#103: exactly one sha2). Reads the lock; builds nothing.
"rust:tree-duplicates" = "oxide tree --locked --offline -e normal -d --target all"
# Build `oxide` with plain Cargo from origin main's tip (or
# OXIDE_INSTALL_PIN, a commit on it) and install it at ~/.local/bin/oxide
# with a hash receipt under ~/.local/state/oxide/install. `oxide:install`
# refuses any existing `oxide`; `oxide:reinstall` replaces only the binary
# matching the newest receipt.
"oxide:install" = "python3 scripts/oxide-install.py"
"oxide:reinstall" = "python3 scripts/oxide-install.py --replace"
# Synthetic fixtures for the installer's link, clobber and identity
# refusals. Never builds or installs.
"dogfood:scripts:test" = "python3 scripts/test_dogfood_scripts.py"
# The shared session supervisor's pure cases (oxide#109): fake clock, process
# table, signals and readings; spawns nothing. Not the qualification.
"proof:supervisor:test" = "python3 scripts/test_supervisor.py --pure"
# Effect-free readiness for the selected host (oxide#151): path, mode, owner and
# device metadata only. Creates nothing (an absent private leaf is reported as
# planned), never sweeps, marks, forks the deadline actor or launches the
# candidate. Point-in-time readiness, not a reservation, admission or
# qualification; the invoked proof re-checks everything in its own setup.
"proof:supervisor:preflight" = "python3 scripts/qualify-supervisor.py --preflight"
# Builds the unpublished oxide-storage-inventory binary and proves the
# rendered output-byte ceiling on tiny synthetic fixtures. Not a QA alias
# and not a real project-target scan.
"rust:storage-inventory-cli" = "python3 scripts/test-storage-inventory-cli.py"
"build-context:comparison:test" = "python3 scripts/test_build_context_comparison.py"
"docs:check" = [
  "effigy skill run northstar/check-links -- --frozen '^docs/knowledge/architecture[.]md$'",
  "effigy skill run northstar/retired-concepts",
  "git diff --check HEAD",
]

[test.suites.rust]
run = "python3 scripts/bounded-test.py oxide test --workspace --all-targets --locked"
default = false

# Installed-binary hand-off (oxide#122): one author proof, one fixed script
# and the whole command under the qualified shared supervisor, within the
# approved 120 s / 64 MiB bounds. Inside that scratch it stages this HEAD's
# debug `oxide` with plain Cargo offline and 1.97.1 (-j1, one codegen unit,
# debug-free, symbol-stripped, size-optimised), deletes the staged target,
# then runs private HOME, receipt and directory-pool fixtures. It creates no
# Oxide pool and touches no live pool, ~/.local/bin/oxide, install receipt or
# host state. Measured peak: 58.3 MiB of the 64 MiB gate, staging ~37 s. Not
# a benchmark, a real-install qualification or an alias for full QA.
[tasks."rust:installed-handoff"]
admission = "heavy"
run = "python3 scripts/bounded-test.py --root-parent /private/tmp --limit 120 --scratch-budget-mib 64 -- python3 scripts/test-installed-handoff.py"

# Owned output links at profile directories (oxide#133): one fixed 20-case
# script and the whole command of the qualified shared supervisor. The brief's
# scoped amendment (root owner, 2026-10-23T16:10Z) makes this proof 600 s TOTAL
# instead of 420; the old 420 s publication at 030836f6 stays historical and
# unactivated. The helper work cutoff is about 565 s (30 s reserve plus a 5 s
# refusal margin), inside which cleanup and image detach must finish. The
# published estimate is UNMEASURED. CPU controls support a 6 CPU / 8 GiB
# planning request: the two independent stagings are sequential and each is
# explicitly bounded to 6 Cargo jobs, fixture Cargo children to 2 jobs with at
# most two gated writers overlapping, so the proof peaks at 6 concurrent Cargo
# jobs; the shared staging helper takes that bound explicitly and keeps its
# default for other selectors. Its private 128 MiB image is attached with
# `hdiutil attach -owners on` on every attach and reattach, observed with a
# bounded read-only mount check and the product's own registration refusal for
# an ignore-ownership mount; no real drive or host setting changes. The 128 MiB
# image is registered at a 16 MiB reserve / 64 MiB cap, a positive control proves
# an external root is really selected before the external oracles, and a
# separate deliberate low-reserve control raises the recorded registration
# reserve to 200 MiB and restores its exact bytes to prove the honest local
# fallback; a `/target/` parent-ignore control proves a directory-only rule is
# refused for the legacy link but accepted for profile members, a benign
# ordinary target-root file on its own checkout keeps the top-level preservation
# control nonvacuous (a clean of that checkout must refuse it as foreign and
# succeed after removal), a real peer checkout receipt for the same root proves
# another reference keeps it, and Cargo's own metadata is asserted only when
# present.
# The selected-clean reserve stop uses a positively created directory-budget
# pool; the removable watchdog is removal-only and is not claimed as a reserve
# stop.
# Scratch stays 512 MiB and the detach is ordinary. It
# stages base 4a70b83 and this HEAD's candidate independently and sequentially
# from authenticated pinned source, asserts distinct binaries and state-3 /
# state-4 capabilities, and covers the member layout, binding, migration,
# clean, refusals and the root-group prune. It has not run: each side's run is
# a separately counted owner activation, and the merge hold requires the exact
# head author and reviewer native receipts.
# Internal-placement exception (decision bd357a4c, 2026-10-25): its private
# fixture pools are genuine internal directory-budget pools, which the product
# correctly refuses on an external volume, so this recipe declares the
# qualified guard's explicit internal root (`--root-parent /private/tmp`). One
# monitored owned root still holds staging, fixtures, temp, evidence and the
# single owned 128 MiB image under the unchanged 600 s / 512 MiB / reserve /
# custody / cleanup rules; ordinary builds, tests and proofs keep the
# selected-volume default.
[tasks."rust:profile-outputs"]
admission = "heavy"
run = "python3 scripts/bounded-test.py --root-parent /private/tmp --limit 600 --scratch-budget-mib 512 -- python3 scripts/test-profile-outputs.py"

# The SAME fixed 20-case proof in its own opt-in diagnostic collection mode
# (`--diagnostic`, decision 1e4feb57): recoverable oracle failures are recorded
# and dependent/tainted steps skipped, while the deadline, custody, unsettled
# children and unrecordable evidence still abort. It exists so the pre-counted
# diagnostic can be routed through a selector instead of passing arguments to
# the counted one; the counted selector above stays byte-for-byte its own
# fail-fast command. Its receipt is marked diagnostic and never claims PASS,
# closure or counted credit, and it needs its own owner activation. It keeps
# the same declared internal root (see the counted selector's exception note)
# and the unchanged 600 s / 512 MiB bound.
[tasks."rust:profile-outputs:diagnostic"]
admission = "heavy"
run = "python3 scripts/bounded-test.py --root-parent /private/tmp --limit 600 --scratch-budget-mib 512 -- python3 scripts/test-profile-outputs.py --diagnostic"

