run = "python3 scripts/bounded-test.py --root-parent /private/tmp --limit 300 --scratch-budget-mib 512 -- python3 scripts/test-profile-outputs.py --base-compat"

[tasks."rust:profile-outputs:base-compat:diagnostic"]
admission = "heavy"
run = "python3 scripts/bounded-test.py --root-parent /private/tmp --limit 300 --scratch-budget-mib 512 -- python3 scripts/test-profile-outputs.py --base-compat --diagnostic"

