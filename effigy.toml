[manifest]
minimum_effigy_version = "0.14.0"

[tasks]
"rust:compile" = "cargo check --workspace --all-targets --locked"
"rust:format" = "cargo fmt --all -- --check"
"rust:private-compile" = "cargo check --workspace --all-targets --locked --features private-qualification"
"rust:test-ordinary-cargo-stable-reuse" = "python3 scripts/bounded-test.py cargo test --lib --locked --features private-qualification storage::tests::stable_reuse::ordinary_cargo_stable_reuse_identity_reuses_across_exact_attempts -- --exact"
"rust:private-process" = "python3 scripts/test-private-process.py"
"registry:acquire:nucleus" = "python3 scripts/acquire-nucleus-registry.py"
"registry:stream:nucleus" = "python3 scripts/acquire-nucleus-registry-stream.py"
"docs:check" = [
  "effigy skill run northstar/check-links -- --frozen '^docs/knowledge/architecture[.]md$'",
  "effigy skill run northstar/retired-concepts",
  "git diff --check HEAD",
]

[test.suites.rust]
run = "python3 scripts/bounded-test.py cargo test --workspace --all-targets --locked"
default = false
