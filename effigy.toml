[manifest]
minimum_effigy_version = "0.14.0"

[tasks]
"rust:compile" = "cargo check --workspace --all-targets --locked"
"rust:format" = "cargo fmt --all -- --check"
# Compile-only check of the crate for the already-installed Linux target
# (oxide#077). It never installs a target, links or runs anything, so it is
# not Linux runtime validation.
"rust:compile-linux" = "cargo check --locked --offline --target x86_64-unknown-linux-gnu"
# Opt-in stable-Cargo profile proofs (oxide#068). Each verifies the resolved
# rustc debug settings Cargo actually passed for workspace, dependency and
# build-time units, then runs the focused native backtrace/unwind probe under
# the named profile. They are focused proofs, not benchmarks and not aliases
# for full QA.
"rust:profile-light" = "python3 scripts/test-cargo-profiles.py --profile oxide-light"
"rust:profile-full-debug" = "python3 scripts/test-cargo-profiles.py --profile oxide-full-debug"
# Builds the unpublished oxide-storage-inventory binary and proves the
# rendered output-byte ceiling on tiny synthetic fixtures. Not a QA alias
# and not a real project-target scan.
"rust:storage-inventory-cli" = "python3 scripts/test-storage-inventory-cli.py"
# Builds the unpublished oxide-storage-lease binary, proves usage refusals,
# and on macOS runs one 128 MiB APFS pool through lease/release/recover/status.
# Heavy admission owns the real image provisioning; it is not a
# filesystem-fill benchmark and not full QA. Table lives at the end of this
# file so later bare task entries stay under [tasks].
"build-context:comparison:test" = "python3 scripts/test_build_context_comparison.py"
"docs:check" = [
  "effigy skill run northstar/check-links -- --frozen '^docs/knowledge/architecture[.]md$'",
  "effigy skill run northstar/retired-concepts",
  "git diff --check HEAD",
]

[test.suites.rust]
run = "python3 scripts/bounded-test.py cargo test --workspace --all-targets --locked"
default = false

# Heavy admission owns the real image provisioning in
# scripts/test-storage-lease-cli.py; it is not a filesystem-fill benchmark
# and not full QA.
[tasks."rust:storage-lease-cli"]
admission = "heavy"
run = "python3 scripts/test-storage-lease-cli.py"

# Builds the unpublished `oxide` front door and, on macOS, proves it on tiny
# offline fixtures over one fresh 128 MiB APFS pool, after proving init/new
# adoption on tiny scratch directories without a pool. Heavy admission owns
# the image provisioning. Not a benchmark and not full QA.
[tasks."rust:oxide-cli"]
admission = "heavy"
run = "python3 scripts/test-oxide-cli.py"

# The separate before-profile phase for oxide#088: stages the product and runs
# only the overhead timing sample set (two rounds, ten measured requests) on
# one fresh 128 MiB APFS pool inside a 120 s clock, printing every raw sample.
# Not a gate and not full QA; `rust:oxide-cli` runs the fixed gate.
[tasks."rust:oxide-overhead-baseline"]
admission = "heavy"
run = "python3 scripts/test-oxide-cli.py --baseline"
