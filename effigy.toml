# Child temporary files on the selected pool (oxide#136), one fixed script and
# the whole command of the qualified shared proof supervisor: 300 s, 512 MiB
# monitored scratch, an ELEVATED trigger (owned-scratch deletion, writer
# closure, removable writes). Stages this HEAD's debug `oxide` offline with
# 1.97.1 and proves on tiny std-only fixtures that an inherited `TMPDIR` is
# kept canonically only when it is a writable directory on the selected
# pool's device (an existing relative value included), that absent/file/
# relative/unwritable/other-device/symlink-escaping values are replaced by one
# short owned directory inside the held slot, that the aliases follow the
