[manifest]
minimum_effigy_version = "0.14.0"

[tasks]
# Ordinary Rust selectors run through the installed `oxide` (dogfooding,
# oxide#087). Each `:cargo` twin keeps the plain-Cargo command: use it when
# `oxide` itself is broken. `fmt` is a Cargo passthrough with no lease.
"rust:compile" = "oxide check --workspace --all-targets --locked"
"rust:compile:cargo" = "cargo check --workspace --all-targets --locked"
"rust:format" = "oxide fmt --all -- --check"
"rust:format:cargo" = "cargo fmt --all -- --check"
# Compile-only check of the crate for the already-installed Linux target
# (oxide#077). It never installs a target, links or runs anything, so it is
# not Linux runtime validation.
"rust:compile-linux" = "oxide check --locked --offline --target x86_64-unknown-linux-gnu"
"rust:compile-linux:cargo" = "cargo check --locked --offline --target x86_64-unknown-linux-gnu"
# Build `oxide` with plain Cargo from origin main's tip (or
# OXIDE_INSTALL_PIN, a commit on it) and install it at ~/.local/bin/oxide
# with a hash receipt under ~/.local/state/oxide/install. `oxide:install`
# refuses any existing `oxide`; `oxide:reinstall` replaces only the binary
# matching the newest receipt.
"oxide:install" = "python3 scripts/oxide-install.py"
"oxide:reinstall" = "python3 scripts/oxide-install.py --replace"
# Synthetic fixtures for the test supervisor's timeout escalation and the
# installer's link, clobber and identity refusals. Never builds or installs.
"dogfood:scripts:test" = "python3 scripts/test_dogfood_scripts.py"
# Builds the unpublished oxide-storage-inventory binary and proves the
# rendered output-byte ceiling on tiny synthetic fixtures. Not a QA alias
# and not a real project-target scan.
"rust:storage-inventory-cli" = "python3 scripts/test-storage-inventory-cli.py"
"build-context:comparison:test" = "python3 scripts/test_build_context_comparison.py"
"docs:check" = [
  "effigy skill run northstar/check-links -- --frozen '^docs/knowledge/architecture[.]md$'",
  "effigy skill run northstar/retired-concepts",
  "git diff --check HEAD",
]

[test.suites.rust]
run = "python3 scripts/bounded-test.py oxide test --workspace --all-targets --locked"
default = false

# Plain-Cargo escape for `test rust`.
[test.suites.rust-cargo]
run = "python3 scripts/bounded-test.py cargo test --workspace --all-targets --locked"
default = false

# SUSPENDED by oxide#102: provisions its pool with the retired standalone
# lease CLI and APFS image backend, so it refuses before any effect until
# migrated to a directory pool. Not a benchmark and not full QA.
[tasks."rust:oxide-cli"]
admission = "heavy"
run = "python3 scripts/test-oxide-cli.py"

# The launch check alone (oxide#093): offline staging into owned scratch,
# no pool, image or download. Not a benchmark and not full QA.
[tasks."rust:oxide-cli:launch-check"]
admission = "heavy"
run = "python3 scripts/test-oxide-cli.py --launch-check"

# Clean safety (oxide#095): stages `oxide` offline with 1.97.1, then proves
# whole-target `clean` ownership (real Cargo target, foreign entries, dry
# run, --include-foreign, symlink referent) and `clean --cargo-cache` config
# parsing on a private CARGO_HOME seeded by copying cfg-if 1.0.0 from the host
# cache. No pool, image or download. Not a benchmark and not full QA.
[tasks."rust:oxide-cli:clean-safety"]
admission = "heavy"
run = "python3 scripts/test-oxide-cli.py --clean-safety"

# SUSPENDED by oxide#102 (retired image pool provisioning; refuses before
# any effect until migrated). Toolchain context (oxide#094): stages `oxide` offline with 1.97.1, then on
# one fresh 128 MiB APFS pool checks that each caller context of a scratch
# workspace (root 1.97.1, member 1.96.1, `--manifest-path`, RUSTC,
# RUSTUP_TOOLCHAIN) gets the slot key of the compiler its Cargo used. Never
# installs a toolchain. Not a benchmark and not full QA.
[tasks."rust:oxide-toolchain-context"]
admission = "heavy"
run = "python3 scripts/test-oxide-cli.py --toolchain-context"

# Removable build volume, part 1 (oxide#097): stages `oxide` offline with
# 1.97.1, then models the removable drive as one separately attached 128 MiB
# APFS sparse image in owned scratch, mounted by hdiutil at a unique
# /Volumes/<name>, over a budget-only internal directory pool: registration
# and refusals, selection present / below reserve / absent, flush cost,
# injected flush-failure retirement, status. Ordinary detach only. Not a
# benchmark and not full QA.
[tasks."rust:oxide-removable-pool"]
admission = "heavy"
run = "python3 scripts/test-oxide-removable-pool.py"

# Budget-only default pool (oxide#102): the removable-pool proof's guarded
# session, preceded by the default-pool cases over a scratch HOME (legacy
# image pool detection untouched, creation at the new path with a verified
# Time Machine exclusion, config and environment precedence, refusals, soft
# budget growth and idle eviction, injected watchdog stop) and with the
# previous-registration refusal before registration. One owned 128 MiB
# image models the removable drive only. Not a benchmark and not full QA.
[tasks."rust:oxide-budget-default"]
admission = "heavy"
run = "python3 scripts/test-oxide-removable-pool.py --budget-default"

# Profile proofs (oxide#068, oxide#106). Each checks the resolved rustc
# debug settings Cargo actually passed for workspace, dependency and
# build-time units: first the opt-in profile with plain Cargo and the
# backtrace/unwind probe, then this clean HEAD's staged `oxide` on a tiny
# offline fixture with a private pool: Oxide's quick or debug recipe on
# Cargo's dev profile, target/debug output, distinct slots per recipe, the
# test profile, an external subcommand's own Cargo, the deprecated
# oxide-quick/oxide-debug definitions, bench and release. 300 s and 512 MiB
# owned scratch including cleanup, under the old session supervisor of
# `test rust`; reserve and scratch sampled at phase boundaries only. Not
# benchmarks and not full QA.
[tasks."rust:profile-light"]
admission = "heavy"
run = "python3 scripts/bounded-test.py python3 scripts/test-cargo-profiles.py --profile oxide-light"

[tasks."rust:profile-full-debug"]
admission = "heavy"
run = "python3 scripts/bounded-test.py python3 scripts/test-cargo-profiles.py --profile oxide-full-debug"

# Pool accounting at build-cache scale (oxide#108): stages the candidate and
# the base commit's `oxide` offline with 1.97.1 and no rustc wrapper, then on
# private directory pools with more than 50,000 real entries proves the old
# bound's refusal, same-generation warm reuse of a 60,000-entry idle slot, a
# new slot beside a 60,000-entry payload, and idle-only eviction with
# hard links counted once beside a held slot. 300 s and 512 MiB owned
# scratch including cleanup, under the session supervisor of `test rust`.
# Not a benchmark and not full QA.
[tasks."rust:pool-scale"]
admission = "heavy"
run = "python3 scripts/bounded-test.py python3 scripts/test-pool-scale.py"

# `oxide exec` and the second-slot rule (oxide#107): stages this clean
# HEAD's `oxide` offline with 1.97.1; on one private directory pool a short
# fixed fixture tool calls the inherited cargo build and cargo metadata:
# slot intermediates and <workspace>/target outputs, --manifest-path, quick /
# debug / release recipes, the #099 fake-wrapper policy, exit codes, Ctrl-C,
# a surviving group member, oxide killed while the tool group lives, two
# commands in one checkout on distinct slots, the host limit, the
# no-safe-slot wait and the clean barrier. 300 s and 512 MiB owned scratch
# including cleanup, under the old session supervisor of `test rust`
# (route B, documented gaps); reserve and scratch sampled at phase
# boundaries only. Not a benchmark and not full QA.
[tasks."rust:oxide-exec"]
admission = "heavy"
run = "python3 scripts/bounded-test.py python3 scripts/test-oxide-exec.py"

# Front-door accounting routes (oxide#110): stages this clean HEAD's debug
# `oxide` offline with 1.97.1; its walk observer logs every inventory walk
# root. On one private directory pool with an idle slot of more than 200,000
# entries, ordinary reuse walks only its target slot, status and readiness
# keep full walks, waits and recovery walk nothing, and new-slot admission
# keeps its whole-payload walks around eviction (hard links counted once).
# 300 s and 512 MiB owned scratch including cleanup, under the old session
# supervisor of `test rust`; reserve and scratch sampled at phase
# boundaries only. Not a benchmark and not full QA.
[tasks."rust:front-door-accounting"]
admission = "heavy"
run = "python3 scripts/bounded-test.py python3 scripts/test-front-door-accounting.py"

# Finder metadata (oxide#105): a short fixed script under heavy admission
# (deadline checked before each child, 20 GiB reserve sampled every 250 ms
# while it runs, owned bytes between phases, one 300 s budget, child
# sessions killed on breach or deadline, ordinary detach). Stages `oxide` offline with
# 1.97.1; .DS_Store and ._* files at every pool level keep a budget-only
# internal pool and one 128 MiB scratch-image removable pool complete and
# warm, bytes counted; an unknown payload entry refuses by name and nothing
# is deleted. Not a benchmark and not full QA.
[tasks."rust:oxide-finder-metadata"]
admission = "heavy"
run = "python3 scripts/test-oxide-finder-metadata.py"

# Project-named slots and pool status (oxide#104): the oxide#105 script's
# child runner unchanged (deadline before each child from one 300 s budget,
# 20 GiB reserve sampled every 250 ms while a child runs, owned scratch
# checked between phases against 512 MiB, ordinary detach). Stages the base
# commit's and this HEAD's `oxide` offline with 1.97.1; a legacy slot stays
# in place and warm; new internal and scratch-image removable slots are
# labelled; status order, grouping and most-recent use with the volume
# selected and detached. Not a benchmark and not full QA.
[tasks."rust:oxide-pool-layout"]
admission = "heavy"
run = "python3 scripts/test-oxide-pool-layout.py"

# SUSPENDED by oxide#102 (retired image pool provisioning; refuses before
# any effect until migrated). Cargo version matrix (oxide#091): one logical proof per exact stable
# release. Each stages `oxide` offline with the builder 1.97.1, then runs the
# shipped freshness gate, stray detection and dep-info decoder under the
# tested Cargo over one fresh 128 MiB APFS pool, plus the installed 1.94.1
# fallback. Never installs a toolchain. Not a benchmark and not full QA.
[tasks."rust:cargo-matrix:1.95.0"]
admission = "heavy"
run = "python3 scripts/test-oxide-cli.py --cargo-matrix 1.95.0"

[tasks."rust:cargo-matrix:1.96.1"]
admission = "heavy"
run = "python3 scripts/test-oxide-cli.py --cargo-matrix 1.96.1"

[tasks."rust:cargo-matrix:1.97.1"]
admission = "heavy"
run = "python3 scripts/test-oxide-cli.py --cargo-matrix 1.97.1"

[tasks."rust:cargo-matrix:1.98.1"]
admission = "heavy"
run = "python3 scripts/test-oxide-cli.py --cargo-matrix 1.98.1"

[tasks."rust:cargo-matrix:1.99.1"]
admission = "heavy"
run = "python3 scripts/test-oxide-cli.py --cargo-matrix 1.99.1"

# Rustc wrapper bypass (oxide#099): stages `oxide` offline with 1.97.1, then
# on tiny std-only fixtures with a private HOME, CARGO_HOME and directory
# pool proves leased check/build/test/clippy and an external subcommand's
# `$CARGO` never run a recording fake `build.rustc-wrapper` (config, env and
# `--config`), plain Cargo does, the workspace wrapper and clippy-driver
# still run, and the OXIDE_ALLOW_RUSTC_WRAPPER=1 opt-in restores it with its
# warning. No real sccache, image or download. Plain-Cargo staging has no
# host-reserve watchdog (reserve checked before and after). Not a benchmark
# and not full QA.
[tasks."rust:oxide-wrapper-bypass"]
admission = "heavy"
run = "python3 scripts/test-oxide-wrapper-bypass.py"
